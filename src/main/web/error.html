<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Có lỗi xảy ra - FOOD MANAGE</title>
    <style>
        :root { --primary:#FF3B1F; --bg:#FFF9F2; --text:#2D2421; --muted:#635752; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
               font-family:'Plus Jakarta Sans', Arial, sans-serif; background:var(--bg); color:var(--text); }
        .card { max-width:460px; width:100%; background:#fff; border:1px solid #F1E4D6; border-radius:20px;
                padding:32px 28px; text-align:center; box-shadow:0 12px 32px rgba(255,59,31,.08); }
        h1 { margin:0 0 8px; font-size:22px; }
        p { margin:0 0 20px; color:var(--muted); line-height:1.5; }
        a { display:inline-block; padding:12px 22px; border-radius:999px; background:var(--primary); color:#fff;
            font-weight:700; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Rất tiếc, có lỗi xảy ra</h1>
        <p>Trang bạn cần không truy cập được hoặc bạn không có quyền xem. Vui lòng thử lại hoặc quay về trang chủ.</p>
        <a href="/">Về trang chủ</a>
    </div>
</body>
</html>
